<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-labelledby="t d">
<title id="t">AgentHQ architecture</title>
<desc id="d">Event flow: Hermes, OpenCode (experimental) and demo adapters feed a Fastify server that sanitises and redacts events, derives state, stores them in SQLite and serves them over an HTTP API and a WebSocket to a React plus Phaser client with an office scene, panels and replay.</desc>
<style>.flow{animation:flow 2.4s linear infinite}@keyframes flow{to{stroke-dashoffset:-48}}@media (prefers-reduced-motion: reduce){*{animation:none!important;}}</style>
